name: Build apps

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build portable .exe
        run: npx electron-builder --win portable --x64 --publish never
      - name: Zip the web version
        shell: pwsh
        run: Compress-Archive -Path index.html, README.md, bridge/bridge.js, bridge/package.json -DestinationPath dist/MonsterBattleLive-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MonsterBattleLive-portable.exe
            dist/MonsterBattleLive-web.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Mac app (Apple Silicon and Intel)
        run: npx electron-builder --mac zip --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/MonsterBattleLive-mac-*.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Monster Battle Live v1.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Windows:** download `MonsterBattleLive-portable.exe` and double-click it. No install needed.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.

            **Mac:** download `MonsterBattleLive-mac-arm64.zip` (Apple Silicon: M1/M2/M3/M4) or `MonsterBattleLive-mac-x64.zip` (Intel).
            Double-click the .zip, then drag **Monster Battle Live** into Applications. The first time, macOS will block it because it is not from the App Store:
            open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.

            **Web version:** `MonsterBattleLive-web.zip` (open `index.html`; see README for the TikTok bridge).
          files: out/*
