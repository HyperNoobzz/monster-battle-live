name: Build apps

on:
  push:
    branches: [main]
    paths-ignore: ['README.md', 'docs/**']   # documentation changes don't need new apps
  workflow_dispatch:

permissions:
  contents: write

# A newer push cancels an older build, so the newest commit is always the latest release.
concurrency:
  group: build-apps
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build portable .exe
        run: npx electron-builder --win portable --x64 --publish never
      - name: Zip the web version
        shell: pwsh
        run: Compress-Archive -Path index.html, README.md, bridge -DestinationPath dist/MonsterBattleLive-web.zip
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            dist/MonsterBattleLive-portable.exe
            dist/MonsterBattleLive-web.zip

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build Mac app (Apple Silicon and Intel)
        run: npx electron-builder --mac dir --arm64 --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      # No paid Apple certificate: sign ad-hoc so macOS offers "Open Anyway"
      # instead of calling the app damaged, then zip it with ditto to keep the signature.
      - name: Sign ad-hoc and zip
        run: |
          set -e
          for arch in arm64 x64; do
            if [ "$arch" = arm64 ]; then dir=dist/mac-arm64; else dir=dist/mac; fi
            app="$dir/Monster Battle Live.app"
            test -d "$app" || { echo "missing $app"; ls dist; exit 1; }
            codesign --force --deep --sign - "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
            ditto -c -k --keepParent "$app" "dist/MonsterBattleLive-mac-$arch.zip"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: dist/MonsterBattleLive-mac-*.zip

  release:
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.${{ github.run_number }}
          name: Monster Battle Live v1.1.${{ github.run_number }}
          make_latest: true
          body: |
            **Windows:** download `MonsterBattleLive-portable.exe` and double-click it. No install needed.
            If Windows says "Windows protected your PC", click **More info**, then **Run anyway**.

            **Mac:** download `MonsterBattleLive-mac-arm64.zip` (Apple Silicon: M1/M2/M3/M4) or `MonsterBattleLive-mac-x64.zip` (Intel).
            Double-click the .zip, then drag **Monster Battle Live** into Applications. The first time, macOS will block it because it is not from the App Store:
            open **System Settings → Privacy & Security**, scroll down and click **Open Anyway**.

            **Web version:** `MonsterBattleLive-web.zip` (open `index.html`; see README for the TikTok bridge).
          files: out/*
